{% extends "base.html" %}
{% block title %}{{ term.name }} &middot; {{ config.title }}{% endblock title %}
{% block content %}
<h1>Tagged &ldquo;{{ term.name }}&rdquo;</h1>
<ul class="post-list archive">
  {% for page in term.pages %}
  <li>
    <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    <time datetime="{{ page.date }}">{{ page.date | date(format="%B %-d, %Y") }}</time>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
